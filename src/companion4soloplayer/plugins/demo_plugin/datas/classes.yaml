# Character classes ----------------------------------------------------
# Original descriptions built on generic fantasy archetypes only.
# can_cast_spells tells whether members of the class may cast spells:
# it gates the spells block of the character creation dialog.
# `save` declares the base saving throws of the class: they are
# assigned (no dice drawn) to the `save` attribute block by the
# class_saves strategy declared in workflow.yaml, then modulated by
# the race/class bonuses of creation_rules.yaml.

# Warrior class
- name: Warrior
  description: A heavily armored melee combatant specializing in physical strength, weapon mastery, and battlefield endurance.
  can_cast_spells: false
  # Class Ability Minimums
  base_stats:
    strength:
      mini: 9
      maxi: 18
    dexterity:
      mini: 3
      maxi: 18
    constitution:
      mini: 3
      maxi: 18
    intelligence:
      mini: 3
      maxi: 18
    wisdom:
      mini: 3
      maxi: 18
    charisma:
      mini: 3
      maxi: 18
  # Base saving throws
  save:
    poison: 16
    magic: 19

