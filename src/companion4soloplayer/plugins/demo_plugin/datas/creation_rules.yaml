# Character creation rules ---------------------------------------------
# Condition/Effect rules evaluated by the core creation rules engine
# after every executed step. Format:
#   when:   list of conditions (ALL must hold): target + operator + value
#   effects: list of actions: target + action + value
# Rules are evaluated in declaration order; each evaluation rebuilds the
# effects from scratch, so nothing is ever applied twice.

rules:
  # --- Racial bonuses and maluses ------------------------------------
  - id: dwarf_hardy
    description: Dwarves are hardy (+2 constitution).
    when:
      - target: choices.race
        operator: eq
        value: Dwarf
    effects:
      - target: values.attributes.constitution
        action: add
        value: 2

  - id: dwarf_save_poison
    description: Dwarves are hardy and resistant to toxins.
    when:
      - target: choices.race
        operator: eq
        value: Dwarf
    effects:
      - target: values.save.poison
        action: add
        value: 2

  - id: dwarf_save_magic
    description: Dwarves have an innate resistance to magic spells.
    when:
      - target: choices.race
        operator: eq
        value: Dwarf
    effects:
      - target: values.save.magic
        action: add
        value: 2

  - id: elf_grace
    description: Elves are agile (+2 dexterity).
    when:
      - target: choices.race
        operator: eq
        value: Elf
    effects:
      - target: values.attributes.dexterity
        action: add
        value: 2

  - id: elf_frail
    description: Elves are slight (-1 constitution).
    when:
      - target: choices.race
        operator: eq
        value: Elf
    effects:
      - target: values.attributes.constitution
        action: sub
        value: 1

  - id: elf_save_magic
    description: Elves have an innate resistance to magic spells.
    when:
      - target: choices.race
        operator: eq
        value: Elf
    effects:
      - target: values.save.magic
        action: add
        value: 2

  - id: gnome_learning
    description: Gnomes are clever (+2 intelligence).
    when:
      - target: choices.race
        operator: eq
        value: Gnome
    effects:
      - target: values.attributes.intelligence
        action: add
        value: 2

  - id: gnome_save_magic
    description: Gnomes have an innate resistance to magic spells.
    when:
      - target: choices.race
        operator: eq
        value: Gnome
    effects:
      - target: values.save.magic
        action: add
        value: 2

  - id: human_versatile
    description: Humans carry an extra wound of resolve (+1 hit point).
    when:
      - target: choices.race
        operator: eq
        value: Human
    effects:
      - target: values.hit_points
        action: add
        value: 1

  # --- Class bonuses and granted skills ------------------------------
  - id: wizard_mind
    description: Wizards train the mind (+2 intelligence).
    when:
      - target: choices.class
        operator: eq
        value: Wizard
    effects:
      - target: values.attributes.intelligence
        action: add
        value: 2

  # --- Bonuses from attribute values ---------------------------------
  - id: sturdy
    description: A constitution of 14 or more grants +2 hit points.
    when:
      - target: values.attributes.constitution
        operator: ge
        value: 14
    effects:
      - target: values.hit_points
        action: add
        value: 2

  - id: mighty
    description: A strength of 16 or more grants +1 hit point.
    when:
      - target: values.attributes.strength
        operator: ge
        value: 16
    effects:
      - target: values.hit_points
        action: add
        value: 1

  # --- Bonuses from other skills -------------------------------------
  - id: iron_body
    description: Knowing Athletics grants +1 hit point.
    when:
      - target: values.skills
        operator: contains
        value: Athletics
    effects:
      - target: values.hit_points
        action: add
        value: 1
