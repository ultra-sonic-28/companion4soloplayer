# Spells ----------------------------------------------------------------
# Level 1 spells may be picked by a starting character; higher levels
# are filtered out by the spell_available filter.

- name: Spark
  level: 1
  school: Evocation
  classes: [Wizard]
  description: A jolt of static electricity leaps to the nearest foe.

- name: Mend
  level: 1
  school: Restoration
  classes: [Priest]
  description: Knit superficial wounds closed with a warm glow.

- name: Frost Touch
  level: 1
  school: Evocation
  classes: [Wizard]
  description: Chill gathers around your hand for a biting touch.

- name: Light
  level: 1
  school: Illumination
  classes: [Wizard, Priest]
  description: A globe of soft light floats above your head.

- name: Rune Ward
  level: 1
  school: Warding
  classes: [Wizard]
  requires_skill: Arcane Lore
  description: Trace a warding rune that discourages the unwary.

- name: Nature's Whisper
  level: 1
  school: Divination
  classes: [Wizard, Priest]
  requires_skill: Nature Lore
  description: The wilds answer your silent question.

- name: Blindness
  level: 2
  school: Enchantment
  classes: [Wizard]
  description: A shimmering veil clouds the vision of a foe.

- name: Spectral Hand
  level: 2
  school: Necromancy
  classes: [Wizard]
  description: A ghostly hand reaches out to touch a distant foe.

- name: Spiritual Hammer
  level: 2
  school: Evocation
  classes: [Priest]
  description: A hammer of divine energy strikes a foe.

- name: Fireball
  level: 3
  school: Evocation
  classes: [Wizard]
  description: A roaring globe of flame bursts at a distant point.
