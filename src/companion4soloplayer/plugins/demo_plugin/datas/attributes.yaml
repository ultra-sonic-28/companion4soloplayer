# Player attribute blocks -----------------------------------------------
# Every top-level entry of this file declares ONE block of attributes,
# rendered as its own group in the player creation dialog:
# - the entry key is the technical block identifier (step id and state
#   path segment: values.<block id>.<attribute id>);
# - `title` is the heading of the block;
# - the ORDER of the top-level entries is the display order of the
#   blocks, and the ORDER of `list` is the display order of the fields;
# - each entry declares:
#     id:          technical identifier used in the state paths and the
#                  answer keys (values.<block id>.<id>, <block id>.<id>)
#     name:        text displayed in the dialog
#     description: optional help text shown as a tooltip

attributes:
  title: "Attributes"
  list:
    - id: strength
      name: "Strength"
      description: "Strength measures your character’s muscle and physical power."
    - id: dexterity
      name: "Dexterity"
      description: "Dexterity measures hand-eye coordination, agility, reflexes, and balance."
    - id: constitution
      name: "Constitution"
      description: "Constitution represents your character’s health and stamina."
    - id: intelligence
      name: "Intelligence"
      description: "Intelligence determines how well your character learns and reasons."
    - id: wisdom
      name: "Wisdom"
      description: "Wisdom describes a character’s willpower, common sense, perception, and intuition."
    - id: charisma
      name: "Charisma"
      description: "Charisma measures a character’s force of personality, persuasiveness, personal magnetism, ability to lead, and physical attractiveness."

save:
  title: "Saving Throws"
  list:
    - id: magic
      name: "Magic"
      description: "Saving throw versus magic"
    - id: poison
      name: "Poison"
      description: "Saving throw versus poison"
