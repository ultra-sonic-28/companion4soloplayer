# Character creation workflow ------------------------------------------
# The ORDER of this list is the order of the creation steps for this
# game system: reorder, add or remove entries to match another system.
# Every step is a !pyclass reference: absolute references point at the
# generic core steps, while 'local:' references resolve inside this
# plugin package (development and compiled builds alike).

steps:
  - !pyclass
    path: companion4soloplayer.core.creation:IdentityStep
    params:
      step_id: identity
      name_prompt: Character name
      background_prompt: Background (origin and motivation)

  - !pyclass
    path: companion4soloplayer.core.creation:SelectionStep
    params:
      step_id: race
      target: choices.race
      catalog: races
      prompt: Choose a race
      optional: true                    # a race may be left undefined

  - !pyclass
    path: companion4soloplayer.core.creation:SelectionStep
    params:
      step_id: class
      target: choices.class
      catalog: classes
      prompt: Choose a class
      optional: true                    # a class may be left undefined

  - !pyclass
    path: companion4soloplayer.core.creation:AttributeGenerationStep
    params:
      block: "*"                    # one step per block of attributes.yaml
      # Generation mode and strategy are declared PER BLOCK, so each
      # type of block gets its own generation method: the attributes
      # are rolled with dice while the saving throws are assigned from
      # the class chosen in classes.yaml (no dice draw at creation).
      mode:
        attributes: random              # random | manual | mixed | auto
        save: auto                      # assigned, never asked
      strategy:                         # named in the system data
        attributes: classic_4d6
        save: class_saves
      min_value: 3
      max_value: 18

  - !pyclass
    path: companion4soloplayer.core.creation:SkillSelectionStep
    params:
      step_id: skills
      mode: free                        # free | inherited | none
      catalog: skills
      prompt: Choose 2 to 4 skills
      min_count: 2
      max_count: 4
      skill_filter: !pyclass local:skill_available   # filtered by type/race/class; empty until a race or class is picked

  - !pyclass
    path: companion4soloplayer.core.creation:SpellSelectionStep
    params:
      step_id: spells
      mode: choice                      # choice | auto | none
      catalog: spells
      prompt: Choose up to 2 spells
      max_count: 2
      spell_filter: !pyclass local:spell_available
